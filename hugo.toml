baseURL      = "https://thelogos.dev/"
languageCode = "ko-KR"
defaultContentLanguage = "ko"
title        = "The Logos"
theme        = "PaperMod"
hasCJKLanguage = true

# Enable raw HTML in markdown files (required for AI Summary Box)
[markup.goldmark.renderer]
  unsafe = true

# Enable math rendering passthrough for KaTeX
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Table of Contents configuration
[markup.tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2

[params]
  description = "기술이 설명하지 못하는 삶을, 신앙과 철학으로 묻습니다. 기독교 신앙에 뿌리를 둔 엔지니어의 관점."
  author = "The Logos"

  # Output full content in RSS
  [params.rss]
    full = true

[services]
  [services.googleAnalytics]
    ID = "G-SST2KJKDK4"

  # RSS Feed Configuration for AI crawlers
  [services.rss]
    limit = -1

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[taxonomies]
  category = "categories"
  tag = "tags"

# Related content configuration for Related Posts feature
[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "date"
    weight = 10
