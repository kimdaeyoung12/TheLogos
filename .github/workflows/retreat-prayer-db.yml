name: Retreat prayer database access regression
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/db/**'
      - '.github/workflows/retreat-prayer-db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tests/db/**'
      - '.github/workflows/retreat-prayer-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/db/package-lock.json
      - run: npm ci --prefix tests/db --ignore-scripts
      - run: npm test --prefix tests/db
