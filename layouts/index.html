{{ define "main" }}
{{ $css := resources.Get "css/journal.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ partial "journal-home.html" . }}
<div class="home-page">
    <section id="subscribe" class="home-subscribe" aria-labelledby="subscribe-title">
        <div class="home-subscribe__icon" aria-hidden="true">
            <span class="material-symbols-outlined">mail</span>
        </div>
        <div>
            <p class="home-section__eyebrow">뉴스레터</p>
            <h2 id="subscribe-title">새 글을 이메일로 받아보세요</h2>
            <p>신학·철학·공학·산문에서 새로 쓴 글을 보내드립니다.</p>
        </div>
        <form id="kit-form" class="home-subscribe__form" action="https://app.kit.com/forms/9062318/subscriptions"
            method="post" data-sv-form="9062318" data-uid="5ede2cf68e">
            <label class="sr-only" for="kit-email">이메일 주소</label>
            <input id="kit-email" name="email_address" type="email" required placeholder="you@example.com" />
            <button type="submit">
                <span class="material-symbols-outlined" aria-hidden="true">send</span>
                구독하기
            </button>
        </form>
        <p id="kit-success" class="home-form-message home-form-message--success hidden">구독해주셔서 감사합니다.</p>
        <p id="kit-error" class="home-form-message home-form-message--error hidden">구독 중 오류가 발생했습니다. 다시 시도해주세요.</p>
        <script>
            document.getElementById('kit-form')?.addEventListener('submit', async function (event) {
                event.preventDefault();
                const form = event.target;
                const button = form.querySelector('button');
                const originalText = button.textContent;
                button.textContent = '보내는 중…';
                button.disabled = true;
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ email_address: form.email_address.value })
                    });
                    if (!response.ok) throw new Error('Subscription failed');
                    document.getElementById('kit-success').classList.remove('hidden');
                    document.getElementById('kit-error').classList.add('hidden');
                    form.classList.add('hidden');
                } catch (error) {
                    document.getElementById('kit-error').classList.remove('hidden');
                    button.textContent = originalText;
                    button.disabled = false;
                }
            });
        </script>
    </section>
</div>
{{ end }}
